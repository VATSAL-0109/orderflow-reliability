services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: ./simulated_services/inventory
      dockerfile: Dockerfile
    container_name: orderflow-inventory
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DEFAULT_LATENCY_MS=0

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/orderflow
      - INVENTORY_SERVICE_URL=http://inventory-service:8001
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30.0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started

volumes:
  pgdata:
