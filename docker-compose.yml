services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: ./simulated_services/inventory
      dockerfile: Dockerfile
    container_name: orderflow-inventory
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DEFAULT_LATENCY_MS=600
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=inventory-service
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      - jaeger

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/orderflow
      - INVENTORY_SERVICE_URL=http://inventory-service:8001
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=0
      - DB_POOL_TIMEOUT=3.0
      - LOG_LEVEL=INFO
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=orderflow-api
      - TRACING_ENABLED=true
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: orderflow-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: orderflow-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.4.1
    container_name: orderflow-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/orderflow-reliability-dashboard.json:/etc/grafana/dashboards/orderflow-reliability-dashboard.json:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
